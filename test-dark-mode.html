<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Test</title>
    <link rel="stylesheet" href="./dist/assets/index-3bdd2969.css">
</head>
<body>
    <div class="min-h-screen bg-white dark:bg-gray-900 text-black dark:text-white p-8">
        <h1 class="text-3xl font-bold mb-4">Dark Mode Test</h1>
        <p class="mb-4">This page should have a dark background when the html element has class="dark".</p>
        
        <div class="p-4 bg-gray-100 dark:bg-gray-800 rounded-lg mb-4">
            <p>This box should be dark gray in dark mode.</p>
        </div>
        
        <div class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg mb-4">
            <p>This box should have a dark border in dark mode.</p>
        </div>
        
        <button onclick="toggleDarkMode()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 text-white rounded">
            Toggle Dark Mode
        </button>
        
        <div class="mt-8 p-4 bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 rounded-md">
            <p class="text-amber-900 dark:text-amber-100">This is an alert box that should change colors in dark mode.</p>
        </div>
    </div>
    
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
